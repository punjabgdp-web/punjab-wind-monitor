name: Update wind data

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min (UTC); METARs are issued around :00 and :30
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch METAR / TAF / model winds
        run: python scripts/fetch_data.py
      - name: Commit if changed
        run: |
          git config user.name  "wind-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi
